<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkShop scene demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #191a2b; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; background: #191a2b; }
  #scene { display: block; image-rendering: pixelated; }
  #hud { position: fixed; left: 6px; bottom: 4px; font: 11px/1.2 ui-monospace, Menlo, monospace; color: #d9c9a3; opacity: 0.75; pointer-events: none; }
  #err { display: none; position: fixed; left: 0; top: 0; right: 0; margin: 0; padding: 6px 8px; font: 12px/1.3 ui-monospace, Menlo, monospace; color: #fff; background: #d6453d; white-space: pre-wrap; z-index: 9; }
</style>
</head>
<body>
<div id="stage"><canvas id="scene" width="480" height="272"></canvas></div>
<div id="hud"></div>
<pre id="err"></pre>
<script type="module" src="./demo.js"></script>
</body>
</html>
